project:
  name: hybrid-ml-ids

datasets:
  cicids2017:
    enabled: true
    raw_dir: data/raw/CICIDS2017

  cic_iot2023:
    enabled: true
    raw_dir: data/raw/CIC-IoT2023

data:
  processed_dir: data/processed

models:
  baseline: true
  ft_transformer: true
  autoencoder: true
  hybrid: true

evaluation:
  metrics:
    - accuracy
    - precision
    - recall
    - f1_score