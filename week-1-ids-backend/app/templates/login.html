{% extends "base.html" %}
{% block title %}Login - IDS Dashboard{% endblock %}
{% block content %}
<div class="min-h-screen flex items-center justify-center">
    <form id="login-form" class="bg-white shadow p-8 rounded-lg w-80 space-y-4">
        <h1 class="text-xl font-semibold text-center">Admin Login</h1>
        <input id="username" placeholder="Username" class="w-full border rounded px-3 py-2" />
        <input id="password" type="password" placeholder="Password" class="w-full border rounded px-3 py-2" />
        <button type="submit" class="w-full bg-teal-600 text-white py-2 rounded">Sign in</button>
        <p id="error" class="text-red-500 text-sm hidden">Invalid credentials</p>
    </form>
</div>
<script>
document.getElementById("login-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const res = await fetch("/api/v1/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            username: document.getElementById("username").value,
            password: document.getElementById("password").value,
        }),
    });
    if (!res.ok) {
        document.getElementById("error").classList.remove("hidden");
        return;
    }
    const data = await res.json();
    localStorage.setItem("ids_token", data.access_token);
    window.location.href = "/dashboard";
});
</script>
{% endblock %}
